[package]
name = "bpsr-readyalert"
version = "1.6.0"
edition = "2021"
build = "build.rs"
description = "Native Rust Ready Check, queue, party, chat, DPS and dungeon mechanics companion for Blue Protocol: Star Resonance"
license = "MIT"

[[bin]]
name = "BPSR-ReadyAlert"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
urlencoding = "2.1"
zstd = "0.13"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
