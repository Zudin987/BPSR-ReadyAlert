name: Release Rust

on:
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: readyalert-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Decide whether this commit should release
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path rust/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match -or $match.Matches.Count -eq 0) { throw 'Could not read Cargo package version.' }
          $version = $match.Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cargo package version was empty.' }
          $tag = "v$version"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedTag = [System.Uri]::EscapeDataString($tag)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $releaseResponse = Invoke-WebRequest -Uri $releaseUri -Headers $headers -Method Get -SkipHttpErrorCheck
          $releaseStatus = [int]$releaseResponse.StatusCode
          if ($releaseStatus -eq 200) {
            Write-Host "Release $tag already exists; successful CI reruns are intentionally a no-op."
            "should_release=false" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($releaseStatus -ne 404) {
            throw "GitHub Releases API returned HTTP $releaseStatus while checking $tag."
          }

          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            $pullsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:TARGET_SHA/pulls"
            $pullsResponse = Invoke-WebRequest -Uri $pullsUri -Headers $headers -Method Get -SkipHttpErrorCheck
            if ([int]$pullsResponse.StatusCode -ne 200) {
              throw "Could not verify PR provenance for $env:TARGET_SHA; GitHub returned HTTP $($pullsResponse.StatusCode)."
            }
            $pulls = @($pullsResponse.Content | ConvertFrom-Json)
            $mergedMain = @($pulls | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' })
            if ($mergedMain.Count -eq 0) {
              Write-Host "Commit $env:TARGET_SHA is not associated with a merged PR into main; automatic release skipped."
              "should_release=false" >> $env:GITHUB_OUTPUT
              "tag=$tag" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          Write-Host "Version $tag is unused and the release provenance gate passed."
          "should_release=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install pinned Rust
        if: steps.release_gate.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Prepare embedded assets
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Unit tests
        if: steps.release_gate.outputs.should_release == 'true'
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked

      - name: Native release build
        if: steps.release_gate.outputs.should_release == 'true'
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

      - name: Smoke-test native EXE
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $exe = './rust/target/release/BPSR-ReadyAlert.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Rust smoke test failed with exit code $($p.ExitCode)" }

      - name: Package
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $match = Select-String -Path rust/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match -or $match.Matches.Count -eq 0) { throw 'Could not read Cargo package version.' }
          $version = $match.Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Cargo package version was empty.' }
          $tag = "v$version"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item './rust/target/release/BPSR-ReadyAlert.exe' './package/BPSR-ReadyAlert.exe'
          Copy-Item './README.md' './package/README.md'
          Copy-Item './LICENSE' './package/LICENSE'
          Copy-Item './THIRD_PARTY_NOTICES.md' './package/THIRD_PARTY_NOTICES.md'
          $hash = (Get-FileHash './package/BPSR-ReadyAlert.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content './package/SHA256SUMS.txt' -Encoding ascii
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/Zudin987/BPSR-ReadyAlert/releases/download/$tag/BPSR-ReadyAlert.exe"
            sha256 = $hash
          }
          $manifest | ConvertTo-Json | Set-Content './update.json' -Encoding utf8
          Compress-Archive -Path './package/*' -DestinationPath "./BPSR-ReadyAlert-$tag-win-x64.zip" -Force
          "TAG=$tag" >> $env:GITHUB_ENV
          "ARCHIVE=BPSR-ReadyAlert-$tag-win-x64.zip" >> $env:GITHUB_ENV
          "EXE=package/BPSR-ReadyAlert.exe" >> $env:GITHUB_ENV
          "SUMS=package/SHA256SUMS.txt" >> $env:GITHUB_ENV
          "MANIFEST=update.json" >> $env:GITHUB_ENV

      - name: Enforce immutable release version
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $encodedTag = [System.Uri]::EscapeDataString($env:TAG)
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck
          $status = [int]$response.StatusCode

          switch ($status) {
            200 {
              throw "Release $env:TAG already exists. ReadyAlert releases are immutable; bump rust/Cargo.toml instead of replacing assets."
            }
            404 {
              Write-Host "Version $env:TAG is unused and safe to publish."
            }
            default {
              throw "GitHub Releases API returned HTTP $status while checking $env:TAG. Body: $($response.Content)"
            }
          }

      - name: Attest release executable
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './package/BPSR-ReadyAlert.exe'

      - name: Publish GitHub release
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:TAG" "$env:ARCHIVE" "$env:EXE" "$env:SUMS" "$env:MANIFEST" --target "$env:TARGET_SHA" --title "BPSR ReadyAlert $env:TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
