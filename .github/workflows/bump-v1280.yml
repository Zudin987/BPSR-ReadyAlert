name: Temporary v1.28.0 Version Bump

on:
  push:
    branches: ["feat/native-ui-modernization"]
    paths: [".github/workflows/bump-v1280.yml"]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-ui-modernization
          fetch-depth: 0
      - name: Bump package version and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [Path('rust/Cargo.toml'), Path('rust/Cargo.lock')]:
              text = name.read_text(encoding='utf-8')
              old = 'version = "1.27.2"'
              if old not in text:
                  raise SystemExit(f'{name}: expected version not found')
              text = text.replace(old, 'version = "1.28.0"', 1)
              name.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/bump-v1280.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock .github/workflows/bump-v1280.yml
          git commit -m "chore: bump version to v1.28.0"
          git push origin HEAD:feat/native-ui-modernization
