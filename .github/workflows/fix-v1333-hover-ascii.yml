name: Fix v1.33.3 consumable hover text

on:
  push:
    branches:
      - feat/v1333-consumable-meter-options

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1333-consumable-meter-options
      - name: Use ASCII hover separator
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/build/legacy/build_v1333_consumable_controls.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('format!("{kind}: {name} • {}",', 'format!("{kind}: {name} - {}",'),
              ('"Food: Feast • 1:00 left"', '"Food: Feast - 1:00 left"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one hover separator target, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add rust/build/legacy/build_v1333_consumable_controls.rs
          git commit -m "Use ASCII consumable hover separator"
          git push origin HEAD:feat/v1333-consumable-meter-options
