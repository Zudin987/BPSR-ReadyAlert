name: Release v1.3.1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v1.3.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare and verify embedded runtime assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Restore
        run: dotnet restore src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Enforce EXE size budget
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/BPSR-ReadyAlert.exe
          $limit = 55MB
          Write-Host ("BPSR-ReadyAlert.exe: {0:N2} MiB (budget: {1:N2} MiB)" -f ($exe.Length / 1MB), ($limit / 1MB))
          if ($exe.Length -gt $limit) {
            throw "Release EXE exceeded the 55 MiB size budget."
          }

      - name: Smoke-test published EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BPSR-ReadyAlert.exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed with exit code $($process.ExitCode)" }
          Write-Host "EXE smoke test passed with exit code $($process.ExitCode)."

      - name: Prepare release assets
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'BPSR-ReadyAlert.exe' } | Remove-Item -Force
          $hash = (Get-FileHash dist/BPSR-ReadyAlert.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-ReadyAlert-v1.3.1-win-x64
          path: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.3.1]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release artifact
        uses: actions/download-artifact@v4
        with:
          name: BPSR-ReadyAlert-v1.3.1-win-x64
          path: dist

      - name: Publish v1.3.1 stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: BPSR Ready Alert v1.3.1
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.3.1 adds distinct sounds and independent tray controls for the core party alerts.

            Highlights:
            - separate bundled sounds for Queue Pop, Ready Check, Party Invite, and Party Join Request;
            - independent Party Invite Alert and Party Request Alert tray toggles directly below Ready Check Alert;
            - removes redundant Show Chat / Hide Chat tray entries so Chat Overlay is the single overlay visibility control;
            - adds individual Test Alert Sounds entries for the four core alert sounds;
            - keeps one shared Ready / Queue / Party volume while Chat alert and TTS volumes remain independent;
            - hardens reproducible audio-asset reconstruction with lossless source verification and regression coverage.

            The Windows x64 build is self-contained and distributed as a single EXE.
            Requires Npcap to be installed.
