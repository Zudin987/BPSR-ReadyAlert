name: Sync v1.33.9 lockfile

on:
  push:
    branches: [fix/dungeon-flow-diagnostics-v1339]
    paths:
      - rust/Cargo.toml
      - .github/workflows/sync-lock-v1339.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dungeon-flow-diagnostics-v1339
          fetch-depth: 0
      - name: Update only root package version
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/Cargo.lock')
          text = path.read_text()
          old = 'name = "bpsr-readyalert"\nversion = "1.33.8"'
          new = 'name = "bpsr-readyalert"\nversion = "1.33.9"'
          assert text.count(old) == 1, 'expected exactly one ReadyAlert v1.33.8 lock entry'
          updated = text.replace(old, new, 1)
          path.write_text(updated)
      - name: Verify one-line lockfile change
        shell: bash
        run: |
          git diff -- rust/Cargo.lock
          test "$(git diff --numstat -- rust/Cargo.lock | awk '{print $1+$2}')" = "2"
          git diff -- rust/Cargo.lock | grep -q -- '-version = "1.33.8"'
          git diff -- rust/Cargo.lock | grep -q -- '+version = "1.33.9"'
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "chore(release): sync Cargo.lock to 1.33.9"
          git push origin HEAD:fix/dungeon-flow-diagnostics-v1339
