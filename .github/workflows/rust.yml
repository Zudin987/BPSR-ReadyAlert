name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
    paths:
      - 'rust/**'
      - 'assets/source/**'
      - 'scripts/prepare-build-assets.ps1'
      - '.github/workflows/rust.yml'
      - '.github/workflows/release.yml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - 'rust/**'
      - 'assets/source/**'
      - 'scripts/prepare-build-assets.ps1'
      - '.github/workflows/rust.yml'
      - '.github/workflows/release.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Sync v1.26 lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/v1260-encounter-history-html'
        shell: pwsh
        run: |
          git fetch origin "$env:GITHUB_HEAD_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B "$env:GITHUB_HEAD_REF" "origin/$env:GITHUB_HEAD_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo update --manifest-path rust/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = git status --porcelain -- rust/Cargo.lock
          if ($changed) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rust/Cargo.lock
            git commit -m 'v1.26: sync Cargo lockfile version'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare embedded assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Unit and regression tests
        shell: pwsh
        run: |
          cargo test --manifest-path rust/Cargo.toml --all-targets --locked 2>&1 | Tee-Object -FilePath rust-test-output.txt
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-output
          path: rust-test-output.txt
          if-no-files-found: error
          retention-days: 3

      - name: Clippy analysis
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked

      - name: Native release build
        run: cargo build --manifest-path rust/Cargo.toml --release --locked

      - name: Smoke-test native EXE
        shell: pwsh
        run: |
          $exe = './rust/target/release/BPSR-ReadyAlert.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Rust smoke test failed with exit code $($p.ExitCode)" }

      - name: Enforce native size budget
        shell: pwsh
        run: |
          $exe = Get-Item './rust/target/release/BPSR-ReadyAlert.exe'
          $limit = 20MB
          Write-Host ("Rust BPSR-ReadyAlert.exe: {0:N2} MiB" -f ($exe.Length / 1MB))
          if ($exe.Length -gt $limit) { throw 'Native EXE exceeded the 20 MiB budget.' }

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-rust | Out-Null
          Copy-Item './rust/target/release/BPSR-ReadyAlert.exe' './dist-rust/BPSR-ReadyAlert.exe'
          $hash = (Get-FileHash './dist-rust/BPSR-ReadyAlert.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content './dist-rust/SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: BPSR-ReadyAlert-rust-win-x64
          path: dist-rust/
          if-no-files-found: error

      - name: Generated source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-source
          path: rust/target/debug/build/bpsr-readyalert-*/out/*.rs
          retention-days: 3
