name: Rust CI

on:
  push:
    branches: [main, rust-rewrite]
    paths:
      - 'rust/**'
      - 'assets/source/**'
      - 'scripts/prepare-build-assets.ps1'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'assets/source/**'
      - 'scripts/prepare-build-assets.ps1'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare embedded assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Focused tracker tests
        run: cargo test --manifest-path rust/Cargo.toml event_tracker

      - name: Focused Imagine tier tests
        run: cargo test --manifest-path rust/Cargo.toml imagine_tier

      - name: Focused exact data-map tests
        run: cargo test --manifest-path rust/Cargo.toml v1171_exact_mapping_tests

      - name: Focused v1.17.2 mechanics/UI tests
        run: cargo test --manifest-path rust/Cargo.toml v1172_

      - name: Focused v1.17.3 sticky-self tests
        run: cargo test --manifest-path rust/Cargo.toml v1173_

      - name: Focused v1.17.4 pinned-self/wheel tests
        run: cargo test --manifest-path rust/Cargo.toml v1174_

      - name: Focused v1.17.5 consumable-name tests
        run: cargo test --manifest-path rust/Cargo.toml v1175_

      - name: Focused v1.17.6 target/enrage tests
        run: cargo test --manifest-path rust/Cargo.toml v1176_

      - name: Focused v1.17.8 toolbar/image tests
        run: cargo test --manifest-path rust/Cargo.toml v1178_

      - name: Focused v1.17.9 toolbar polish tests
        run: cargo test --manifest-path rust/Cargo.toml v1179_

      - name: Focused v1.18.0 overlay polish tests
        run: cargo test --manifest-path rust/Cargo.toml v1180_

      - name: Focused v1.18.1 post-release audit tests
        run: cargo test --manifest-path rust/Cargo.toml v1181_

      - name: Focused v1.18.2 DPS/Tracker UI tests
        run: cargo test --manifest-path rust/Cargo.toml v1182_

      - name: Focused v1.18.3 sticky-self direction tests
        run: cargo test --manifest-path rust/Cargo.toml v1183_

      - name: Focused v1.18.5 DPS identity tests
        run: cargo test --manifest-path rust/Cargo.toml v1185_

      - name: Focused v1.18.6 overlay scale tests
        run: cargo test --manifest-path rust/Cargo.toml v1186_

      - name: Focused v1.18.7 DPS minimum-size tests
        run: cargo test --manifest-path rust/Cargo.toml v1187_

      - name: Unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Native release build
        run: cargo build --manifest-path rust/Cargo.toml --release

      - name: Smoke-test native EXE
        shell: pwsh
        run: |
          $exe = './rust/target/release/BPSR-ReadyAlert.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Rust smoke test failed with exit code $($p.ExitCode)" }

      - name: Enforce native size budget
        shell: pwsh
        run: |
          $exe = Get-Item './rust/target/release/BPSR-ReadyAlert.exe'
          $limit = 20MB
          Write-Host ("Rust BPSR-ReadyAlert.exe: {0:N2} MiB" -f ($exe.Length / 1MB))
          if ($exe.Length -gt $limit) { throw 'Native EXE exceeded the 20 MiB budget.' }

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-rust | Out-Null
          Copy-Item './rust/target/release/BPSR-ReadyAlert.exe' './dist-rust/BPSR-ReadyAlert.exe'
          $hash = (Get-FileHash './dist-rust/BPSR-ReadyAlert.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content './dist-rust/SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: BPSR-ReadyAlert-rust-win-x64
          path: dist-rust/
          if-no-files-found: error

      - name: Generated source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-source
          path: rust/target/debug/build/bpsr-readyalert-*/out/*.rs
          retention-days: 3
