name: Sync v1.32.2 package version

on:
  push:
    branches:
      - fix/v1322-final-hardening

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1322-final-hardening
          fetch-depth: 0
      - name: Synchronize Cargo package version
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('rust/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          old = 'version = "1.32.1"'
          new = 'version = "1.32.2"'
          if old in text:
              text = text.replace(old, new, 1)
              manifest.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected Cargo.toml package version')

          lock = Path('rust/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.32.1"'
          new = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.32.2"'
          if old in text:
              text = text.replace(old, new, 1)
              lock.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected Cargo.lock package version')
      - name: Commit synchronized version
        shell: bash
        run: |
          if git diff --quiet -- rust/Cargo.toml rust/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock
          git commit -m "Bump package version to v1.32.2"
          git push origin HEAD:fix/v1322-final-hardening
