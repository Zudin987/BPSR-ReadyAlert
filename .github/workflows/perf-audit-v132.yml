name: v1.3.2 UI Performance Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v132-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare and verify embedded runtime assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Restore
        run: dotnet restore src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj

      - name: Publish exact single-file EXE
        run: >-
          dotnet publish src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Run published EXE and print UI metrics
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BPSR-ReadyAlert.exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if (Test-Path ./dist/ui-performance-v132.txt) {
            Write-Host '--- v1.3.2 UI performance metrics ---'
            Get-Content ./dist/ui-performance-v132.txt
            Write-Host '--- end metrics ---'
          } else {
            Write-Warning 'UI performance metrics file was not produced.'
          }
          if (Test-Path ./dist/smoke-test-error.txt) {
            Write-Host '--- smoke failure detail ---'
            Get-Content ./dist/smoke-test-error.txt
          }
          if ($process.ExitCode -ne 0) { throw "Published EXE audit failed with exit code $($process.ExitCode)" }

      - name: Report EXE size and SHA256
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/BPSR-ReadyAlert.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("BPSR-ReadyAlert.exe bytes={0} mib={1:N2}" -f $exe.Length, ($exe.Length / 1MB))
          Write-Host ("BPSR-ReadyAlert.exe sha256={0}" -f $hash)
