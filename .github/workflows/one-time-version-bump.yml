name: One-time release version preparation

on:
  push:
    branches: [ui/reference-dps-meter]
    paths: ['.github/workflows/one-time-version-bump.yml']

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/reference-dps-meter
          persist-credentials: true
      - name: Bump package and lockfile without changing dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('rust/Cargo.toml')
          text = manifest.read_text()
          old = 'version = "1.33.9"'
          assert text.count(old) == 1, 'Expected version 1.33.9 once in manifest'
          text = text.replace(old, 'version = "1.33.10"', 1)
          text = text.replace('# Patch release: add diagnostic-only dungeon flow decoding for safe live validation.', '# Release: DPS/Chat/Mechanics UI audit, Encounter History comparison and workflow updates.')
          manifest.write_text(text)
          lock = Path('rust/Cargo.lock')
          text = lock.read_text()
          old = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.33.9"'
          assert text.count(old) == 1, 'Expected package version 1.33.9 once in Cargo.lock'
          lock.write_text(text.replace(old, old.replace('1.33.9', '1.33.10'), 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.toml rust/Cargo.lock
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore: bump immutable release version to v1.33.10'
          git push origin HEAD:ui/reference-dps-meter
