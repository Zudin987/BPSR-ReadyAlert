name: Release v1.2.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release-v1.2.5]')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare and verify embedded runtime assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Restore
        run: dotnet restore src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Enforce EXE size budget
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/BPSR-ReadyAlert.exe
          $limit = 55MB
          Write-Host ("BPSR-ReadyAlert.exe: {0:N2} MiB (budget: {1:N2} MiB)" -f ($exe.Length / 1MB), ($limit / 1MB))
          if ($exe.Length -gt $limit) {
            throw "Release EXE exceeded the 55 MiB size budget."
          }

      - name: Smoke-test published EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BPSR-ReadyAlert.exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed with exit code $($process.ExitCode)" }
          Write-Host "EXE smoke test passed with exit code $($process.ExitCode)."

      - name: Generate checksum
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'BPSR-ReadyAlert.exe' } | Remove-Item -Force
          $hash = (Get-FileHash dist/BPSR-ReadyAlert.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name,Length

      - name: Create v1.2.5 stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: BPSR Ready Alert v1.2.5
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.2.5 is a live UI polish and reliability follow-up to v1.2.4.

            Highlights:
            - fixes the Chat Overlay tab strip after adding custom tabs: no bright native horizontal scrollbar and no manual resize recovery;
            - compacts overflowing tab buttons with ellipsis while keeping full tab names in tooltips;
            - fixes message divider lines so they continue cleanly to the custom dark scrollbar edge instead of stopping early;
            - shortens the cleanup label to `Hide emoji + linked items / Hypertext`;
            - requests the Windows dark theme for Settings scrollbars;
            - aligns Visual Highlight and Sound Rule match fields to the available Alerts-page width while keeping them one-line;
            - keeps Settings geometry prewarmed so the UI polish does not reintroduce gear-button opening latency;
            - retains the independent Ready / Queue, Chat alert and TTS volumes plus all v1.2.4 reliability improvements;
            - expands the published single-file regression suite for tab fitting, Alert alignment, dark scrollbar theming and full-width chat dividers.

            Translation/TTS use undocumented Google Translate/gTTS-style web endpoints and may be rate-limited or changed upstream.
            Requires Npcap to be installed.
