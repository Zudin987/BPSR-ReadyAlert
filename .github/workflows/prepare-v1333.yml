name: Prepare v1.33.3 consumable settings

on:
  push:
    branches:
      - feat/v1333-consumable-meter-options

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1333-consumable-meter-options
      - name: Patch meter settings and version
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          settings_path = Path('rust/src/feature_settings_v170.rs')
          text = settings_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = replace_once(
              text,
              '    pub show_imagines: bool,\n    pub show_target: bool,',
              '    pub show_imagines: bool,\n    /// Show per-player Food / Serum status indicators in normal and Raid meter views.\n    pub show_consumables: bool,\n    pub show_target: bool,',
              'MeterSettings show_consumables field',
          )
          text = replace_once(
              text,
              '''        Self {\n            show_damage_share: true,\n            show_healing_share: true,\n            show_tank_share: true,\n            show_deaths: true,\n            show_imagines: true,\n            show_target: true,\n            remember_scroll: false,\n            show_active_rates: true,''',
              '''        Self {\n            show_damage_share: false,\n            show_healing_share: false,\n            show_tank_share: false,\n            show_deaths: false,\n            show_imagines: true,\n            show_consumables: true,\n            show_target: true,\n            remember_scroll: false,\n            show_active_rates: true,''',
              'fresh meter defaults',
          )
          settings_path.write_text(text, encoding='utf-8', newline='\n')

          build_path = Path('rust/build/legacy/build_v1333_consumable_controls.rs')
          build = build_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          anchor = '''        "Food/Serum settings mutation",\n    );\n\n    replace_once(\n        &mut source,\n        r#"fn raid_consumable_color'''
          insertion = '''        "Food/Serum settings mutation",\n    );\n\n    replace_once(\n        &mut source,\n        r#"const RAID_FS_YELLOW_MS:i64=120_000;\nconst RAID_FS_RED_MS:i64=30_000;"#,\n        "",\n        "obsolete consumable threshold constants",\n    );\n\n    replace_once(\n        &mut source,\n        r#"fn raid_consumable_color'''
          build = replace_once(build, anchor, insertion, 'obsolete threshold cleanup stage')
          build_path.write_text(build, encoding='utf-8', newline='\n')

          toml_path = Path('rust/Cargo.toml')
          toml = toml_path.read_text(encoding='utf-8')
          toml = replace_once(toml, 'version = "1.33.2"', 'version = "1.33.3"', 'Cargo.toml version')
          toml_path.write_text(toml, encoding='utf-8', newline='\n')

          lock_path = Path('rust/Cargo.lock')
          lock = lock_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          lock = replace_once(
              lock,
              'name = "bpsr-readyalert"\nversion = "1.33.2"',
              'name = "bpsr-readyalert"\nversion = "1.33.3"',
              'Cargo.lock package version',
          )
          lock_path.write_text(lock, encoding='utf-8', newline='\n')
          '@ | python -
      - name: Commit prepared v1.33.3
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add rust/src/feature_settings_v170.rs rust/build/legacy/build_v1333_consumable_controls.rs rust/Cargo.toml rust/Cargo.lock
          git commit -m "Add configurable Food and Serum meter indicators"
          git push origin HEAD:feat/v1333-consumable-meter-options
