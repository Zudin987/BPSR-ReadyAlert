# One-shot verification on the already-merged branch. Delete after the check.
name: Verify v1.33.14 release (temporary)
on:
  push:
    branches: ['fix/late-load-wipe-lifecycle']
    paths:
      - '.github/workflows/verify-release-v13314.yml'
permissions:
  contents: write
jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and independently validate all four published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/readyalert-release
          gh release download v1.33.14 --repo "$GITHUB_REPOSITORY" --dir /tmp/readyalert-release
          cd /tmp/readyalert-release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('.')
          archive = 'BPSR-ReadyAlert-v1.33.14-win-x64.zip'
          expected = {archive, 'BPSR-ReadyAlert.exe', 'SHA256SUMS.txt', 'update.json'}
          actual = {item.name for item in root.iterdir() if item.is_file()}
          assert actual == expected, f'Asset set mismatch: {actual}'
          exe = (root / 'BPSR-ReadyAlert.exe').read_bytes()
          digest = hashlib.sha256(exe).hexdigest()
          checksum_lines = (root / 'SHA256SUMS.txt').read_text(encoding='ascii').strip().splitlines()
          assert len(checksum_lines) == 1, 'Expected exactly one checksum line'
          assert checksum_lines[0].split() == [digest, 'BPSR-ReadyAlert.exe'], 'Checksum mismatch'
          manifest = json.loads((root / 'update.json').read_text(encoding='utf-8-sig'))
          expected_manifest = {
              'version': '1.33.14',
              'url': 'https://github.com/Zudin987/BPSR-ReadyAlert/releases/download/v1.33.14/BPSR-ReadyAlert.exe',
              'sha256': digest,
          }
          assert manifest == expected_manifest, f'Updater metadata mismatch: {manifest}'
          with zipfile.ZipFile(root / archive) as bundle:
              assert bundle.testzip() is None, 'Archive has corrupted content'
              packed_exe = bundle.read('BPSR-ReadyAlert.exe')
              assert hashlib.sha256(packed_exe).hexdigest() == digest, 'ZIP EXE differs from release EXE'
          print('PASS: four assets, EXE SHA256SUMS, update.json version/URL/hash, ZIP integrity and embedded EXE hash')
          print('Verified EXE sha256:', digest)
          PY
      - name: Append explicit gameplay validation caveat to release notes
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.33.14 --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/readyalert-release-notes.md
          if ! grep -q 'Gameplay validation limitation' /tmp/readyalert-release-notes.md; then
            cat >> /tmp/readyalert-release-notes.md <<'NOTES'

          ### Gameplay validation limitation
          Automated tests, Windows CI, release build, packaged EXE and published asset checks passed. However, real current-game raid success/wipe, boss phase, rapid repull, slow-PC loading, and lagging Android relay packet sequences were not verified with sanitized live captures. Encounter splitting requires correlated Playing → Settlement plus a new-run/scene signal; missing or UUID-less packets can still leave consecutive raids combined. Previously missed damage cannot be reconstructed, and boss death alone deliberately does not reset a multi-phase raid. See PR #170 for details.
          NOTES
          fi
          gh release edit v1.33.14 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/readyalert-release-notes.md
          echo 'PASS: release notes include explicit live-gameplay caveat'
