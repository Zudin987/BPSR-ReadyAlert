name: One-time release lock sync
on:
  push:
    branches: [feat/reference-meter-dark-cards]
    paths: ['.github/workflows/sync-release-lock-temporary.yml']
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'Zudin987/BPSR-ReadyAlert'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reference-meter-dark-cards
          persist-credentials: true
      - name: Update only the root package's Cargo.lock version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          toml = Path('rust/Cargo.toml').read_text(encoding='utf-8')
          assert toml.count('version = "1.33.8"') == 1, 'release manifest must be v1.33.8'
          lock = Path('rust/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.33.7"'
          new = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.33.8"'
          assert text.count(old) == 1, 'old lock package must occur exactly once'
          lock.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- rust/Cargo.lock
      - name: Commit exact lockfile version change to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): synchronize Cargo.lock with v1.33.8'
          git push origin HEAD:feat/reference-meter-dark-cards
