name: v1.30.2 lock sync

on:
  push:
    branches:
      - fix/v1302-ui-ux-audit

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1302-ui-ux-audit
      - name: Sync root package version
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/Cargo.lock')
          text = path.read_text()
          old = 'name = "bpsr-readyalert"\nversion = "1.30.1"'
          new = 'name = "bpsr-readyalert"\nversion = "1.30.2"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one root package version, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- rust/Cargo.lock; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          git commit -m 'Sync Cargo.lock for v1.30.2'
          git push origin HEAD:fix/v1302-ui-ux-audit
