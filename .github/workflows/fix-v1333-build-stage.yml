name: Fix v1.33.3 build-stage test literal

on:
  push:
    branches:
      - feat/v1333-consumable-meter-options

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1333-consumable-meter-options
      - name: Fix nested raw string
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/build/legacy/build_v1333_consumable_controls.rs')
          text = path.read_text(encoding='utf-8')
          old = 'serde_json::from_str(r#"{\\"showImagines\\":false}"#).unwrap()'
          new = 'serde_json::from_str("{\\\\\\"showImagines\\\\\\":false}").unwrap()'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one nested raw JSON test literal, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add rust/build/legacy/build_v1333_consumable_controls.rs
          git commit -m "Fix v1.33.3 generated settings regression test"
          git push origin HEAD:feat/v1333-consumable-meter-options
