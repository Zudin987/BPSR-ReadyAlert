name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare and verify embedded runtime assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Restore
        run: dotnet restore src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Enforce EXE size budget
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/BPSR-ReadyAlert.exe
          $limit = 55MB
          Write-Host ("BPSR-ReadyAlert.exe: {0:N2} MiB (budget: {1:N2} MiB)" -f ($exe.Length / 1MB), ($limit / 1MB))
          if ($exe.Length -gt $limit) {
            throw "Release EXE exceeded the 55 MiB size budget. Review new dependencies/runtime changes before release."
          }

      - name: Smoke-test single-file EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BPSR-ReadyAlert.exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed with exit code $($process.ExitCode)" }
          Write-Host "EXE smoke test passed with exit code $($process.ExitCode)."

      - name: Keep release files only
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'BPSR-ReadyAlert.exe' } | Remove-Item -Force
          $hash = (Get-FileHash dist/BPSR-ReadyAlert.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-ReadyAlert-win-x64
          path: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: BPSR-ReadyAlert-win-x64
          path: dist

      - name: Update Latest Build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            Automatic Windows x64 build from the latest `main` branch.

            Download `BPSR-ReadyAlert.exe`, place it anywhere, and run it. The app is self-contained and requires no .NET installation.

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
