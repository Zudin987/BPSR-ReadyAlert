name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for the same PR/ref. Rapid RC commits previously left
# stale Windows jobs queued ahead of the actual candidate and delayed validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare and verify embedded runtime assets
        shell: pwsh
        run: ./scripts/prepare-build-assets.ps1

      - name: Restore
        run: dotnet restore src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish src/BPSR.ReadyAlert/BPSR.ReadyAlert.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Enforce EXE size budget
        shell: pwsh
        run: |
          $exe = Get-Item ./dist/BPSR-ReadyAlert.exe
          $limit = 55MB
          Write-Host ("BPSR-ReadyAlert.exe: {0:N2} MiB (budget: {1:N2} MiB)" -f ($exe.Length / 1MB), ($limit / 1MB))
          if ($exe.Length -gt $limit) {
            throw "Release EXE exceeded the 55 MiB size budget. Review new dependencies/runtime changes before release."
          }

      - name: Smoke-test single-file EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/BPSR-ReadyAlert.exe -ArgumentList '--build-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed with exit code $($process.ExitCode)" }
          Write-Host "EXE smoke test passed with exit code $($process.ExitCode)."

      - name: Keep release files only
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'BPSR-ReadyAlert.exe' } | Remove-Item -Force
          $hash = (Get-FileHash dist/BPSR-ReadyAlert.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BPSR-ReadyAlert.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name,Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-ReadyAlert-win-x64
          path: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: BPSR-ReadyAlert-win-x64
          path: dist

      - name: Update Latest Build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            Automatic Windows x64 build from the latest `main` branch.

            Download `BPSR-ReadyAlert.exe`, place it anywhere, and run it. The app is self-contained and requires no .NET installation.

      - name: Create v0.9.0 RC release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v0.9.0]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: BPSR Ready Alert v0.9.0 RC
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            Release candidate for v1.0.0.

            Main changes from v0.6.1:
            - migrated the self-contained build to .NET 10 LTS, reducing EXE size substantially without trimming;
            - hardened log rotation and stale asset/adapter handling;
            - repaired the application icon source;
            - tightened GitHub Actions release permissions and added a 55 MiB size regression guard.

            Please live-test Ready Check, matchmaking queue popup, adapter switching, alert volume, tray/Explorer icon, and normal exit before v1.0.0.

      - name: Create v1.0.0 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.0.0]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: BPSR Ready Alert v1.0.0
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            First stable release of BPSR Ready Alert.

            Highlights:
            - Ready Check and matchmaking / party-confirm sound alerts;
            - bundled LetsDoThis alert sound with app-local volume control;
            - Npcap capture with Resonance Logs CN adapter reuse and manual adapter selection;
            - optional desktop notifications;
            - auto-launch of Resonance Logs CN;
            - Start Menu shortcut support;
            - self-contained Windows x64 single EXE on .NET 10;
            - exact user-supplied tray / Explorer icon handling.

            Requires Npcap to be installed.

      - name: Create v1.1.0 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.1.0]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: BPSR Ready Alert v1.1.0
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.1.0 adds the optional BPSR Chat Overlay while keeping the existing Ready Check and matchmaking alerts lightweight.

            Highlights:
            - shared-capture chat decoding: no second Npcap engine or duplicate TCP/zstd pipeline;
            - borderless floating chat overlay with World, Guild/Team, All and custom tabs;
            - channel selection, minimum level, Show/Hide filters, case-insensitive OR/AND/regex matching and invalid-regex protection;
            - Smart Scroll, timestamps, compact mode, opacity, fonts, channel colors, click-through and screen-edge collapse;
            - up to three prioritized message-only keyword/regex sound rules with one shared chat-alert volume;
            - Private/Talk highlighting and optional sound;
            - saved settings, blocked-user list, settings backup recovery and capture diagnostics;
            - improved DPI/layout handling and child-dialog Always-on-Top behavior;
            - all previous Ready/Queue, Resonance Logs CN integration, adapter selection and tray features retained.

            Requires Npcap to be installed.

            See the README for filter syntax and Chat Overlay setup.

      - name: Create v1.1.1 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.1.1]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: BPSR Ready Alert v1.1.1
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.1.1 hardens Chat Overlay reliability and scrolling.

            Highlights:
            - chat keyword/private sound handling is independent from overlay rendering, so collapse/hide/repaint cannot stop sound matching;
            - follow-latest/history trimming no longer jumps away from the newest chat;
            - smoother precision mouse-wheel scrolling and a custom dark scrollbar;
            - deterministic per-user sender colors for easier conversation tracking;
            - compiled/cached regex matching with timeout protection;
            - bounded custom notification WAV size/duration and cache usage;
            - IPv6 TCP capture support and richer voice/multilingual/hypertext chat extraction;
            - expanded RC2 regression coverage for sound, scrolling, IPv6, rich chat and WAV limits.

            Requires Npcap to be installed.

      - name: Create v1.1.2 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.1.2]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: BPSR Ready Alert v1.1.2
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.1.2 is a small Chat Overlay usability patch.

            Highlights:
            - the persistent Chat Overlay is now excluded from Windows Alt+Tab;
            - the overlay remains visible on-screen and stays out of the taskbar;
            - the behavior is preserved while expanded, collapsed, click-through, or Always-on-Top;
            - Settings and support dialogs remain normal switchable windows while open;
            - adds regression coverage for the required Windows extended window styles.

            Includes all reliability, scrolling, notification, IPv6, and rich-chat improvements from v1.1.1.

            Requires Npcap to be installed.

      - name: Create v1.2.0 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.2.0]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: BPSR Ready Alert v1.2.0
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.2.0 adds optional English translation and Guild / Party text-to-speech to the Chat Overlay.

            Highlights:
            - no-key Google Translate web translation for World, Guild, and Party / Team, rendered below the original message;
            - no-key Google English TTS for Guild and Party / Team only;
            - NAudio + Windows Media Foundation playback with independent TTS volume;
            - optional sender-name reading and exact own-username ignore;
            - quick TTS toolbar toggle with green ON / red strikethrough OFF state;
            - global hide options for BPSR sprite-only emoji and Hypertext/linked-item rows;
            - TTS-priority scheduling so busy World translation cannot starve Guild/Party speech;
            - bounded queues/cache, stale-job skipping, Google response validation/retry, and soft failure behavior;
            - keeps previous Ready/Queue alerts, Alt+Tab overlay exclusion, scroll reliability, IPv6 and rich-chat improvements.

            Translation/TTS use undocumented Google Translate/gTTS-style web endpoints and may be rate-limited or changed upstream.
            Requires Npcap to be installed.

      - name: Create v1.2.1 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.2.1]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: BPSR Ready Alert v1.2.1
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.2.1 is a UI/UX and reliability hardening release for the v1.2 chat translation/TTS feature set.

            Highlights:
            - makes Ready / Queue, Chat alert, and TTS volume controls explicitly independent and removes unscaled Windows system-sound fallbacks;
            - adds clear active/off/inactive TTS toolbar states, including muted and no-channel feedback;
            - makes Settings persistence truthful with Saved, Unsaved, and Applied — not saved states plus safe close warnings;
            - makes blocked-user behavior consistent across overlay rows, chat sounds, translation, and not-yet-playing TTS while leaving Ready / Queue alerts untouched;
            - hardens Windows clipboard actions, diagnostics interaction, click-through state synchronization, and Npcap adapter-switch rollback;
            - bounds chat UI work per timer tick and coalesces redraws for smoother behavior during large message bursts;
            - expands deterministic single-file regression coverage for volume separation, persistence failures, blocked routing, cleanup filters, TTS state, and burst draining.

            Translation/TTS use undocumented Google Translate/gTTS-style web endpoints and may be rate-limited or changed upstream.
            Requires Npcap to be installed.

      - name: Create v1.2.2 stable release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.2.2]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: BPSR Ready Alert v1.2.2
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
          body: |
            BPSR Ready Alert v1.2.2 fixes TTS volume isolation and refreshes the Settings experience.

            Highlights:
            - TTS volume is now applied directly to decoded speech samples instead of the shared Windows WaveOut session, so it cannot reduce Ready / Queue or chat-alert playback;
            - Settings page switching updates only the outgoing/incoming page on a buffered surface to reduce WinForms layout/repaint work;
            - Settings uses a more compact, minimalist layout with shorter copy, smaller controls, bounded input widths, and safer minimum-size behavior;
            - Add/Edit Chat Tab is smaller and cleaner with compact filters/channel selection, a clear Cancel action, and unsaved-change protection;
            - regression coverage verifies TTS sample gain isolation, compact UI dimensions, navigation state, and minimum-size action placement.

            Translation/TTS use undocumented Google Translate/gTTS-style web endpoints and may be rate-limited or changed upstream.
            Requires Npcap to be installed.

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/BPSR-ReadyAlert.exe
            dist/SHA256SUMS.txt
