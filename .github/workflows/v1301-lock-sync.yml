name: Temporary v1.30.1 lock sync

on:
  push:
    branches:
      - fix/v1301-skill-id-coverage

permissions:
  contents: write

jobs:
  sync-lock-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Sync root package version in Cargo.lock
        shell: python
        run: |
          from pathlib import Path
          path = Path("rust/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          old = 'name = "bpsr-readyalert"\nversion = "1.30.0"'
          new = 'name = "bpsr-readyalert"\nversion = "1.30.1"'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one root package version match, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "Lock v1.30.1 package version"
          git push origin HEAD:${GITHUB_REF_NAME}
