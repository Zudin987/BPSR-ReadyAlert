name: Season 4 CN ID Audit

on:
  push:
    branches:
      - data/season4-cn-id-port
    paths:
      - tools/season4_cn_sync.py
      - .github/workflows/season4-cn-id-audit.yml
      - rust/data/game_names_v1300.tsv.zst.*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data/season4-cn-id-port
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check zstandard

      - name: Generate CN delta and translation report
        run: python tools/season4_cn_sync.py

      - name: Upload audit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: season4-cn-id-audit
          path: |
            rust/data/game_names_season4_cn.tsv
            docs/season4-cn-id-audit.md

      - name: Commit generated audit result
        shell: bash
        run: |
          if git diff --quiet -- rust/data/game_names_season4_cn.tsv docs/season4-cn-id-audit.md; then
            echo 'No generated delta changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/data/game_names_season4_cn.tsv docs/season4-cn-id-audit.md
          git commit -m 'Generate Season 4 CN ID delta [skip ci]'
          git push origin HEAD:data/season4-cn-id-port
