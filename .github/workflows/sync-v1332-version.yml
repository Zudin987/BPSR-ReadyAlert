name: Sync v1.33.2 version

on:
  push:
    branches:
      - fix/v1332-meter-align-archive-sidebar

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1332-meter-align-archive-sidebar
      - name: Sync package version
        shell: pwsh
        run: |
          $toml = Get-Content rust/Cargo.toml -Raw
          if ($toml -notmatch 'version = "1\.33\.1"') { throw 'Cargo.toml 1.33.1 version not found' }
          $toml = $toml -replace 'version = "1\.33\.1"', 'version = "1.33.2"'
          Set-Content rust/Cargo.toml $toml -NoNewline

          $lock = Get-Content rust/Cargo.lock -Raw
          $pattern = 'name = "bpsr-readyalert"\r?\nversion = "1\.33\.1"'
          if ($lock -notmatch $pattern) { throw 'bpsr-readyalert 1.33.1 lock entry not found' }
          $lock = [regex]::Replace($lock, $pattern, "name = `"bpsr-readyalert`"`r`nversion = `"1.33.2`"", 1)
          Set-Content rust/Cargo.lock $lock -NoNewline
      - name: Commit synchronized version
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) { exit 0 }
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock
          git commit -m "Bump ReadyAlert to v1.33.2"
          git push origin HEAD:fix/v1332-meter-align-archive-sidebar
