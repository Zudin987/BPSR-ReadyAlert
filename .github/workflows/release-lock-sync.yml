# Temporary release preparation workflow. Remove from the PR after lockfile is committed.
name: Release lockfile sync (temporary)
on:
  push:
    branches: ['fix/late-load-wipe-lifecycle']
    paths:
      - '.github/workflows/release-lock-sync.yml'
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Synchronize only the root package version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('rust/Cargo.toml').read_text()
          if '\nversion = "1.33.14"\n' not in manifest:
              raise SystemExit('Unexpected manifest version; refusing lockfile edit')
          path = Path('rust/Cargo.lock')
          text = path.read_text()
          original = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.33.13"\n'
          replacement = '[[package]]\nname = "bpsr-readyalert"\nversion = "1.33.14"\n'
          if text.count(original) != 1:
              raise SystemExit('Unexpected lockfile root package; refusing lockfile edit')
          path.write_text(text.replace(original, replacement, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/Cargo.lock
          git commit -m 'chore(release): sync Cargo.lock package version to v1.33.14'
          git push origin HEAD:refs/heads/fix/late-load-wipe-lifecycle
